<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe check</title>
<!-- The renderers load "assets/volumes/..." relative to the document, so make the page behave as if it sat at the repo root. -->
<base href="../../">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="src/renderers/volume.css">
<link rel="stylesheet" href="src/renderers/xray.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<style>html,body{margin:0;background:#111}#v{width:900px;height:700px;position:relative}</style></head>
<body><div id="v"></div>
<script type="module">
import { createRendererSwitch } from "./src/renderers/switch.js";
import { createProbe } from "./src/live/probe.js";
const renderers = createRendererSwitch({ viewer: document.getElementById("v"), models: { dummy: { modelUrl: "assets/model/none.glb", structuresUrl: "assets/model/none.json" } } });
const probe = await createProbe({ studiesUrl: "assets/live/studies.json", renderers });
window.__probe = probe; window.__renderers = renderers;
window.__ready = true;
</script></body></html>
